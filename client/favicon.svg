<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1240"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#d9c98a"/>
      <stop offset="100%" stop-color="#6a5520"/>
    </linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2c0e"/>
      <stop offset="100%" stop-color="#1c1406"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e8ff"/>
      <stop offset="55%" stop-color="#1e8fc4"/>
      <stop offset="100%" stop-color="#06243a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <circle cx="32" cy="30" r="26" fill="url(#glow)"/>

  <!-- Pyramid: apex (32,8), base-left (10,52), base-front (32,46), base-right (54,52) -->
  <!-- Right (shadow) face -->
  <polygon points="32,8 32,46 54,52" fill="url(#faceR)"/>
  <!-- Left (lit) face -->
  <polygon points="32,8 10,52 32,46" fill="url(#faceL)"/>
  <!-- Edge highlight -->
  <polyline points="10,52 32,8 54,52" fill="none" stroke="#ffeaa8" stroke-width="0.7" opacity="0.8"/>
  <line x1="32" y1="8" x2="32" y2="46" stroke="#2a1d05" stroke-width="0.5" opacity="0.6"/>

  <!-- Eye on the lit face, centered around (24, 32) -->
  <g>
    <!-- almond shape -->
    <path d="M 14 32 Q 24 22 34 32 Q 24 40 14 32 Z" fill="#fff8e2" stroke="#3a2a05" stroke-width="0.6"/>
    <!-- iris -->
    <circle cx="24" cy="32" r="5" fill="url(#iris)"/>
    <!-- pupil -->
    <circle cx="24" cy="32" r="2.2" fill="#000"/>
    <!-- catchlight -->
    <circle cx="22.5" cy="30.5" r="0.9" fill="#ffffff"/>
    <!-- lash hint -->
    <path d="M 14 32 Q 24 22 34 32" fill="none" stroke="#2a1d05" stroke-width="0.8"/>
  </g>

  <!-- light rays from apex -->
  <g stroke="#ffe9a8" stroke-width="0.5" opacity="0.55" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="2"/>
    <line x1="32" y1="6" x2="26" y2="3"/>
    <line x1="32" y1="6" x2="38" y2="3"/>
    <line x1="32" y1="6" x2="22" y2="5"/>
    <line x1="32" y1="6" x2="42" y2="5"/>
  </g>
</svg>
